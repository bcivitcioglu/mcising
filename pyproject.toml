[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "mcising"
version = "0.28.0"
description = "High-performance Ising model Monte Carlo simulation with Rust core"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Burak Civitcioglu", email = "bcivitcioglu@gmail.com" },
]
keywords = [
    "ising-model",
    "monte-carlo",
    "statistical-mechanics",
    "physics",
    "simulation",
    "frustrated-magnetism",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.2.6",
    "rich>=14.3.3",
    "typer>=0.24.1",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.10.8",
]
dataframe = [
    "pandas>=2.2",
]

[dependency-groups]
# The dev environment installs the optional extras so the full test
# suite (plotting, dataframe) always runs locally and in CI.
dev = [
    "matplotlib>=3.10.8",
    "maturin>=1.12.6",
    "mypy>=1.19.1",
    "pandas>=2.2",
    "pre-commit>=4.0.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.scripts]
mcising = "mcising.cli:app"

[project.urls]
Homepage = "https://github.com/bcivitcioglu/mcising"
Documentation = "https://bcivitcioglu.github.io/mcising"
Repository = "https://github.com/bcivitcioglu/mcising"
Issues = "https://github.com/bcivitcioglu/mcising/issues"

[tool.maturin]
python-source = "python"
module-name = "mcising._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: takes seconds-to-minutes; excluded by the canonical gate (-m 'not slow')",
    "statistical: asserts on Monte Carlo estimates; runs over every seed in tests._stats.DEFAULT_SEEDS",
]

[tool.coverage.report]
# Coverage ratchet: raised by each test-debt phase to measured value - 1
# (P01 baseline 39, P12 measured 90, P13 measured 98). CI relies on this
# single source of truth; never lower it to make a build pass.
fail_under = 97

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
# 3.12 = the version mypy runs under locally and in CI; numpy's stubs use
# PEP 695 syntax that mypy rejects for older target versions.
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["h5py", "peapods"]
ignore_missing_imports = true
