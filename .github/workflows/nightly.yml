name: Nightly

# The slow suite: physics-validation runs that take minutes rather than
# seconds (the Onsager u(T) curve, the Tc-campaign rerun). The per-push CI
# gate excludes them (-m "not slow"); this schedule keeps them green
# without slowing every pull request.
on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  slow:
    name: Slow suite (release build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --python 3.12

      - name: Build Rust extension (release)
        run: uv run maturin develop --release

      - name: Run the slow suite
        # No --cov: the coverage ratchet belongs to the canonical suite.
        run: uv run pytest -m slow --durations=10
