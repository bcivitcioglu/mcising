name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings

  rust-test:
    name: Rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Build Rust extension (release)
        run: uv run maturin develop --release

      - name: Run tests
        run: uv run pytest -m "not slow" --cov=mcising --cov-report=term-missing --cov-fail-under=39

      - name: Lint (ruff)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run ruff check python/ tests/

      - name: Type check (mypy)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run mypy python/mcising/

      # MYPYPATH guards against the vacuous pass: without stub
      # resolution stubtest prints Success while analyzing nothing.
      # py.typed closes the same hole for the installed package.
      - name: Stub check (stubtest)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          MYPYPATH: python
        run: uv run python -m mypy.stubtest mcising._core

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --group docs
      - name: Build docs
        run: uv run mkdocs build --strict
